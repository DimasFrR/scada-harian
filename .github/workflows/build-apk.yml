name: Build APK (Android debug)

# Build APK debug setiap push ke main + bisa dijalankan manual.
# APK diunduh dari tab Actions > artifact "scada-harian-apk", lalu install di HP.
# Catatan: APK ini memuat situs Vercel live (server.url di capacitor.config.ts),
# jadi pastikan aplikasi web sudah ter-deploy sebelum APK dipakai.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup JDK 21
        # Capacitor 7 butuh JDK 21 (source release 21); JDK 17 gagal compile.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK (pakai SDK bawaan runner ubuntu)
        # android-actions/setup-android@v3 gagal: memanggil `sdkmanager tools`
        # (paket legacy yang sudah tidak ada). Runner ubuntu sudah membawa
        # ANDROID_HOME + cmdline-tools; tinggal pastikan paket yang dibutuhkan ada.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app (verifikasi)
        run: npm run build

      - name: Tambah platform Android bila belum ada
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scada-harian-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
